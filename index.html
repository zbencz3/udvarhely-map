<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Udvarhely hirdetés-térkép</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body,#map{height:100%;margin:0}
  .price-pin{background:#fff;border:2px solid #333;border-radius:10px;padding:1px 6px;
    font:600 12px/-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;white-space:nowrap;
    box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .popup b{font-size:13px}
  .legend{position:absolute;bottom:12px;left:12px;z-index:1000;background:#fff;
    padding:8px 12px;border-radius:8px;font:12px sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style></head><body>
<div id="map"></div>
<div class="legend">
  <div><i style="background:#e03131"></i>drága</div>
  <div><i style="background:#f08c00"></i>reális</div>
  <div><i style="background:#2f9e44"></i>jó ár</div>
  <div><i style="background:#1971c2"></i>nincs becslés</div>
  <div><i style="background:#6741d9"></i>eladva</div>
  <div style="margin-top:4px">T = telek · H = ház</div>
</div>
<script>
const pts = [{"lat": 46.3054961, "lon": 25.2935434, "square": false, "label": "90k", "color": "#1971c2", "popup": "<div class=\"popup\"><b>Kétszobás lakás a Tomcsa Sándor utcában</b><br>89 700 € · Tomcsa Sándor utca<br>lakás · 52 m² · 1 725 €/m² · 2026-10-30<br><a href=\"https://www.szekelyhirdeto.info/aprohirdetes/15-haz-lakas/963686-ketszobas-lakas-a-tomcsa-sando.html\" target=\"_blank\">hirdetés</a></div>"}, {"lat": 46.2991636, "lon": 25.2922184, "square": false, "label": "H 98k", "color": "#1971c2", "popup": "<div class=\"popup\"><b>Családi ház a Domb utcában Székelyudvarhelyen</b><br>97 700 € · Domb<br>ház · 92 m² · 1 062 €/m² · 2026-10-30<br><a href=\"https://www.szekelyhirdeto.info/aprohirdetes/15-haz-lakas/962712-csaladi-haz-a-domb-utcaban-sze.html\" target=\"_blank\">hirdetés</a></div>"}, {"lat": 46.2937818, "lon": 25.2896391, "square": false, "label": "H 175k", "color": "#1971c2", "popup": "<div class=\"popup\"><b>Két ház a II. Rákóczi Ferenc utcában kiváló lehetőséggel</b><br>175 000 € · II. Rákóczi Ferenc utca<br>ház · 180 m² · 972 €/m² · 2026-10-30<br><a href=\"https://www.szekelyhirdeto.info/aprohirdetes/15-haz-lakas/955102-ket-haz-a-ii-rakoczi-ferenc-ut.html\" target=\"_blank\">hirdetés</a></div>"}, {"lat": 46.3142412, "lon": 25.2840989, "square": false, "label": "H 110k", "color": "#1971c2", "popup": "<div class=\"popup\"><b>Akció! Családi ház Farcádi utcában, Székelyudvarhely, Well</b><br>109 700 € · Farcádi utca<br>ház · 2026-10-30<br><a href=\"https://www.szekelyhirdeto.info/aprohirdetes/15-haz-lakas/955232-akcio-csaladi-haz-farcadi-utca.html\" target=\"_blank\">hirdetés</a></div>"}, {"lat": 46.3050656, "lon": 25.2982272, "square": false, "label": "135k", "color": "#1971c2", "popup": "<div class=\"popup\"><b>Apartman Székelyudvarhely ultra központi zónájában! Well ing</b><br>135 000 € · Bethlen Gábor utca<br>lakás · 63 m² · 2 143 €/m² · 2026-10-31<br><a href=\"https://www.szekelyhirdeto.info/aprohirdetes/15-haz-lakas/945837-apartman-szekelyudvarhely-ultr.html\" target=\"_blank\">hirdetés</a></div>"}, {"lat": 46.305415599999996, "lon": 25.2987272, "square": false, "label": "135k", "color": "#1971c2", "popup": "<div class=\"popup\"><b>Apartman Székelyudvarhely ultraközponti zónájában! Well ing</b><br>135 000 € · Bethlen Gábor utca<br>lakás · 82 m² · 1 646 €/m² · 2026-10-31<br><a href=\"https://www.szekelyhirdeto.info/aprohirdetes/15-haz-lakas/945834-apartman-szekelyudvarhely-ultr.html\" target=\"_blank\">hirdetés</a></div>"}, {"lat": 46.3024661, "lon": 25.2900825, "square": false, "label": "64k", "color": "#1971c2", "popup": "<div class=\"popup\"><b>2 szobás világos lakás székelyudvarhely központjában</b><br>63 990 € · Sziget<br>lakás · 36 m² · 1 778 €/m² · 2026-10-31<br><a href=\"https://www.szekelyhirdeto.info/aprohirdetes/15-haz-lakas/957801-2-szobas-vilagos-lakas-szekely.html\" target=\"_blank\">hirdetés</a></div>"}];
const map = L.map('map');
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom: 19}).addTo(map);
const group = [];
for (const p of pts) {
  const icon = L.divIcon({className:'', html:
    `<div class="price-pin" style="border-color:${p.color};color:${p.color};border-radius:${p.square ? '2px' : '10px'}">${p.label}</div>`,
    iconAnchor:[18,10]});
  const m = L.marker([p.lat, p.lon], {icon}).addTo(map);
  m.bindPopup(p.popup, {maxWidth: 280});
  group.push(m);
}
map.fitBounds(L.featureGroup(group).getBounds().pad(0.15));
</script></body></html>
